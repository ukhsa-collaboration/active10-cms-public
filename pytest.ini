# Pytest configuration for Django/DRF projects.
#
# Coverage gate is set to 85% — adjust `--cov-fail-under` if this project
# has a different floor. Lower it temporarily for greenfield work, but
# never below 80% for production code without team agreement.

[pytest]
DJANGO_SETTINGS_MODULE = active10.settings

# Discovery patterns (Django convention + pytest-style).
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# -v          : verbose test names — clearer CI logs
# --tb=short  : compact tracebacks (long ones drown CI output)
# --cov       : enable coverage (configured in .coveragerc / pyproject)
# --cov-fail-under=85 : fail the suite if coverage drops below 85%
addopts = -v --tb=short --cov --cov-fail-under=85
